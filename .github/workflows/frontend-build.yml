name: Compliance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compliance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app alembic

      - name: Require exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t heads < <(
            python -m alembic heads |
            sed -n 's/[[:space:]]*(head)[[:space:]]*$//p'
          )

          echo "Alembic heads: ${#heads[@]}"

          if [ "${#heads[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head; found ${#heads[@]}."
            python -m alembic heads
            exit 1
          fi

          echo "Canonical Alembic head: ${heads[0]}"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Production build
        run: npm run build
