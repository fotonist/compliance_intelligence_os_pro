version: "3.9"

services:

  db:
    image: postgres:15
    container_name: compliance_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compliance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: compliance_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/compliance_db

  frontend:
    build: ./frontend
    container_name: compliance_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: